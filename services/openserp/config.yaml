server:
  raw_requests: false

app:
  timeout: 30
  browser_path: /headless-shell/headless-shell
  leakless: true

cache:
  ttl_seconds: 900
  max_size: 1000

resilience:
  max_retries: 0
  allow_endpoint_fallback: false

circuit_breaker:
  failures: 2
  recovery_seconds: 600
  successes: 1

google:
  rate_requests: 4
  rate_seconds: 60
  rate_burst: 1
